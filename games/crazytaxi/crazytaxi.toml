# Crazy Taxi, MK-51035 V1.004 (1999-12-19), USA
# Written by `dcdisc new-game`, then edited by hand. Everything here is read off the disc or is
# the standard Katana layout; nothing from the disc itself is ever committed.

[game]
id = "crazytaxi"
title = "Crazy Taxi"
region = "USA"
product = "MK-51035"

[disc]
image = "../../assets/Crazy Taxi (USA).chd"

[binary]
path = "extracted/fs/1ST_READ.BIN"
load_address = 0x8C010000    # where the console's BIOS loads the file
link_address = 0x0C010000    # the same RAM through a different address; what the code assumes
entry = 0x8C010000           # the first instruction

# No code files besides 1ST_READ.BIN: `dcdisc scan` found SH-4 code in nothing else on the disc
# (2026-11-03), and there is no movie player. If a boot report shows untranslated calls far
# from the main program, that is the first place to look again.

# Addresses discovery does not reach, and regions the program copies and runs elsewhere, both go
# here. Run the launcher with --suggest-config FILE and it writes them for you.
[functions]
# Call targets the 2026-11-03 boot test (120 guest s, into gameplay) reached untranslated.
extra = [0x0C081476,  # 181,621 calls, the hottest code the run interpreted
         0x0C081E56,  # 15,368
         0x0C0854A0,  # 26
         0x0C086B74,  # 1
         0x0C161046,  # 1
         0x0C161050,  # 1
         0x0C16112E,  # 1
         0x0C16114A]  # 1

# Exception and interrupt stubs the startup copies below the program. VBR = 0x8C00F400: 0x100 and
# 0x400 hold copies of one stub, 0x600 the interrupt stub (each run through the interpreter on
# every interrupt, 47,181 times in the boot test). Like SA-nx's, stubs can patch their own
# literal pool, so every literal is read at run time (no_fold).
[[relocations]]
source = 0x0C16BC14
size = 0x34
dest = 0x8C00F400
no_fold = true

[[relocations]]
source = 0x0C16BB80
size = 0x34
dest = 0x8C00F500
no_fold = true

[[relocations]]
source = 0x0C16BB80
size = 0x34
dest = 0x8C00F800
no_fold = true

[[relocations]]
source = 0x0C16BBB8
size = 0x58
dest = 0x8C00FA00
no_fold = true
# Play test 2026-11-03: the stub also jumps to 0x20 into itself.
entries = [0x8C00FA00, 0x8C00FA20]

# Other run-time copies the 2026-11-03 boot test found (exact byte matches).
[[relocations]]
source = 0x0C010100
size = 0xE04
dest = 0x8C004000

